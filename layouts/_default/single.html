{{ define "main" }}
  <article class="terra-page-shell">
    <header class="terra-section-header terra-page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}
        <p>{{ . }}</p>
      {{ end }}
    </header>

    {{ with .Content }}
      <div class="terra-page-body terra-prose">
        {{ . }}
      </div>
    {{ end }}
  </article>
{{ end }}
